<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empresas parceiras | Milani Soluções Digitais</title><style>:root{font-family:Inter,system-ui,Arial;background:#07152d;color:#edf5ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:32px 20px}a{color:#80d9ff}h1{font-size:clamp(26px,4vw,40px)}.muted{color:#b6cce4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#112b49;border:1px solid #315477;border-radius:16px;padding:18px}.card img{display:block;width:100%;height:auto;max-height:680px;object-fit:contain;border-radius:10px;background:#07152d;margin:12px 0}.card h2{font-size:clamp(19px,2.3vw,25px);line-height:1.25}.card p{line-height:1.55}.card .muted{font-weight:600}.btn,button{display:inline-block;border:0;background:#1ab6d9;color:#031a2b;border-radius:9px;padding:11px 16px;font-weight:750;cursor:pointer;text-decoration:none}input,select,textarea{background:#091b32;border:1px solid #42607b;color:white;padding:11px;border-radius:8px;width:100%}label{display:block;margin:12px 0;font-size:14px}table{width:100%;border-collapse:collapse}td,th{padding:11px;border-bottom:1px solid #315477;text-align:left}section{margin:26px 0}</style></head><body><main class="wrap"><a href="/">← MILANI SOLUÇÕES DIGITAIS</a><h1>📢 Empresas parceiras</h1><p class="muted">Publicidade • Conheça negócios de Votuporanga e região</p><div id="ads" class="grid"><p>Carregando anúncios...</p></div><p class="muted">Conteúdo publicitário identificado. Os links levam a sites externos.</p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.49.8';const db=createClient('https://lydznydmkcwqtxukktyy.supabase.co','sb_publishable_jJ98f2Xpok2CrjJ4KfRFmA_ahQaWfAv');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const box=document.getElementById('ads');const {data,error}=await db.from('milani_ads').select('id,business_name,title,description,image_url,destination_url,plan').in('placement',['parceiros','todos']).eq('active',true).eq('payment_status','pago').lte('start_date',new Date().toISOString().slice(0,10)).or('end_date.is.null,end_date.gte.'+new Date().toISOString().slice(0,10)).order('created_at',{ascending:false});if(error)box.textContent='Não foi possível carregar os anúncios.';else if(!data.length)box.innerHTML='<p>Nenhum anúncio publicado no momento.</p>';else{box.innerHTML=data.map(a=>'<article class="card"><small>PUBLICIDADE · '+esc(a.plan)+'</small>'+(a.image_url?'<img loading="lazy" src="'+esc(a.image_url)+'" alt="Anúncio de '+esc(a.business_name)+'">':'')+'<h2>'+esc(a.title)+'</h2><p>'+esc(a.description)+'</p><p class="muted">'+esc(a.business_name)+'</p><a class="btn ad-click" data-id="'+esc(a.id)+'" href="'+esc(a.destination_url)+'" target="_blank" rel="noopener noreferrer">Conhecer empresa ↗</a></article>').join('');for(const a of data)db.from('milani_ad_events').insert({ad_id:a.id,event_type:'view'}).then(()=>{});box.addEventListener('click',e=>{const a=e.target.closest('.ad-click');if(a)db.from('milani_ad_events').insert({ad_id:a.dataset.id,event_type:'click'}).then(()=>{})})}
</script></body></html>
