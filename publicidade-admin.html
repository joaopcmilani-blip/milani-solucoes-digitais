</style></head><body><main class="wrap"><a href="/portal.html">← Voltar ao painel</a><h1>📢 Gerenciar publicidade</h1><p id="status" class="muted" role="status" aria-live="polite">Verificando acesso administrativo...</p><div id="app" hidden><section class="card"><h2 id="formtitle">Cadastrar anunciante</h2><form id="form"><input type="hidden" name="id"><div class="grid"><label>Empresa<input name="business_name" required maxlength="120"></label><label>Título do anúncio<input name="title" required maxlength="140"></label><label>Imagem (URL HTTPS)<input name="image_url" type="url" placeholder="https://..."></label><label>Ou envie uma imagem do computador (JPG, PNG ou WebP; até 5 MB)<input id="ad-image-file" type="file" accept="image/jpeg,image/png,image/webp"><small class="muted">Ao escolher um arquivo, ele será enviado ao salvar o anúncio.</small></label><label>Link de destino / WhatsApp<input name="destination_url" type="url" required placeholder="https://..."></label><label>Plano<select name="plan"><option value="gratuito">Institucional / Sem fins lucrativos — Gratuito · 30 dias</option><option value="express">Divulgação Express — 7 dias · R$ 20</option><option value="quinzenal">Divulgação Quinzenal — 15 dias · R$ 35</option><option value="mensal">Divulgação Mensal — 30 dias · R$ 60</option><option value="trimestral">Divulgação Trimestral — 90 dias · R$ 150</option><option value="semestral">Divulgação Semestral — 180 dias · R$ 270</option><option value="anual">Divulgação Anual — 365 dias · R$ 480</option><option value="basico">Básico (legado)</option><option value="destaque">Destaque (legado)</option><option value="premium">Premium (legado)</option></select></label><label>Local<select name="placement"><option value="inicio">Página inicial</option><option value="parceiros">Parceiros</option><option value="todos">Ambos</option></select></label><label>Valor do plano (R$)<input name="monthly_price" type="number" min="0" step=".01" value="20.00" required></label><label>Início<input name="start_date" type="date" required></label><label>Fim<input name="end_date" type="date"></label><label>Pagamento<select name="payment_status"><option value="pendente">Pendente</option><option value="pago">Pago</option><option value="atrasado">Atrasado</option></select></label><label>Publicação<select name="active"><option value="false">Desativado</option><option value="true">Ativado</option></select></label><label>ID do prospect (opcional)<input name="prospect_id" placeholder="UUID do CRM"></label></div><label>Descrição<textarea name="description" rows="3" maxlength="500"></textarea></label><button>Salvar anúncio</button> <button type="button" id="clear">Novo anúncio</button></form></section><section><h2>Anúncios cadastrados</h2><p class="muted">A publicação exige anúncio ativado, pagamento marcado como pago e datas vigentes. Pagamentos são registrados manualmente.</p><div id="list" class="grid"></div></section></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.49.8';const db=createClient('https://lydznydmkcwqtxukktyy.supabase.co','sb_publishable_jJ98f2Xpok2CrjJ4KfRFmA_ahQaWfAv');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st=document.getElementById('status'),app=document.getElementById('app'),form=document.getElementById('form'),list=document.getElementById('list');let rows=[];
async function refresh(){const [r,e]=await Promise.all([db.from('milani_ads').select('*').order('created_at',{ascending:false}),db.from('milani_ad_events').select('ad_id,event_type')]);if(r.error){st.textContent=r.error.message;return}rows=r.data||[];const stats={};for(const x of e.data||[]){stats[x.ad_id]??={view:0,click:0};stats[x.ad_id][x.event_type]++}list.innerHTML=rows.map(a=>'<article class="card"><small>'+esc(a.plan)+' · '+esc(a.placement)+'</small><h3>'+esc(a.business_name)+'</h3><p>'+esc(a.title)+'</p><p>Pagamento: '+esc(a.payment_status)+' | '+(a.active?'Ativo':'Desativado')+'</p><p>📅 '+esc(a.start_date)+' até '+esc(a.end_date||'sem término')+'</p><p>👁 '+(stats[a.id]?.view||0)+' visualizações · 🖱 '+(stats[a.id]?.click||0)+' cliques</p><button data-edit="'+esc(a.id)+'">Editar</button> <button data-del="'+esc(a.id)+'">Excluir</button></article>').join('')||'<p>Nenhum anunciante cadastrado.</p>'}
document.getElementById('clear').onclick=()=>{form.reset();document.getElementById('ad-image-file').value='';form.elements.id.value='';form.elements.start_date.value=new Date().toISOString().slice(0,10);document.getElementById('formtitle').textContent='Cadastrar anunciante'};
form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form),obj=Object.fromEntries(fd);const id=obj.id;delete obj.id;const file=document.getElementById('ad-image-file').files[0];if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){st.textContent='Escolha JPG, PNG ou WebP com até 5 MB.';return}const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];const path=crypto.randomUUID()+'.'+ext;st.textContent='Enviando imagem...';const up=await db.storage.from('milani-publicidade').upload(path,file,{contentType:file.type,upsert:false});if(up.error){st.textContent='Erro no envio: '+up.error.message;return}obj.image_url=db.storage.from('milani-publicidade').getPublicUrl(path).data.publicUrl}obj.active=obj.active==='true';obj.monthly_price=Number(obj.monthly_price);obj.end_date=obj.end_date||null;obj.prospect_id=obj.prospect_id||null;if(obj.image_url&&!/^https:\/\//i.test(obj.image_url)){st.textContent='A imagem precisa usar HTTPS.';return}if(!/^https:\/\//i.test(obj.destination_url)){st.textContent='O link precisa usar HTTPS.';return}const saveBtn=form.querySelector('button[type=submit],button:not([type])');saveBtn.disabled=true;st.textContent='Salvando anúncio no banco de dados...';try{const r=id?await db.from('milani_ads').update(obj).eq('id',id).select('id,business_name').single():await db.from('milani_ads').insert(obj).select('id,business_name').single();if(r.error){st.textContent='❌ Não foi possível salvar: '+r.error.message;return}if(!r.data?.id){st.textContent='❌ Não foi possível confirmar o salvamento. Seus campos foram mantidos.';return}st.textContent='✅ Anúncio salvo com sucesso: '+r.data.business_name+' (ID: '+r.data.id+').';await refresh();document.getElementById('clear').click();window.scrollTo({top:0,behavior:'smooth'})}catch(err){st.textContent='❌ Erro ao salvar: '+(err?.message||String(err))}finally{saveBtn.disabled=false}};
list.onclick=async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(edit){const a=rows.find(x=>x.id===edit.dataset.edit);if(!a)return;for(const [k,v]of Object.entries(a))if(form.elements[k])form.elements[k].value=v===null?'':typeof v==='boolean'?String(v):v;document.getElementById('formtitle').textContent='Editar '+a.business_name;window.scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('Excluir este anúncio e suas estatísticas?')){const r=await db.from('milani_ads').delete().eq('id',del.dataset.del);st.textContent=r.error?r.error.message:'Anúncio excluído.';await refresh()}}
(async()=>{try{const {data:{user},error:ue}=await db.auth.getUser();if(ue)throw ue;const {data:admin,error:ae}=user?await db.rpc('is_milani_admin'):{data:false};if(ae)throw ae;if(!admin){st.textContent='Acesso restrito. Entre como administrador pelo portal.';return}app.hidden=false;st.textContent='Acesso autorizado. Pronto para cadastrar anúncios.';form.elements.start_date.value=new Date().toISOString().slice(0,10);await refresh()}catch(err){st.textContent='Erro ao carregar painel: '+(err?.message||String(err));console.error('Publicidade ADM:',err)}})();
</script><script id="milani-ads-plan-autofill">
document.addEventListener('DOMContentLoaded',()=>{
const form=document.getElementById('form');if(!form)return;
const plans={gratuito:{days:30,price:0},express:{days:7,price:20},quinzenal:{days:15,price:35},mensal:{days:30,price:60},trimestral:{days:90,price:150},semestral:{days:180,price:270},anual:{days:365,price:480}};
const fields=form.elements;
function calc(){const p=plans[fields.plan.value];if(!p)return;fields.monthly_price.value=p.price.toFixed(2);const start=fields.start_date.value;if(!start)return;const [y,m,d]=start.split('-').map(Number);const end=new Date(Date.UTC(y,m-1,d));end.setUTCDate(end.getUTCDate()+p.days-1);fields.end_date.value=end.toISOString().slice(0,10)}
fields.plan.addEventListener('change',calc);fields.start_date.addEventListener('change',calc);
document.getElementById('clear')?.addEventListener('click',()=>setTimeout(calc,0));
form.addEventListener('reset',()=>setTimeout(calc,0));
setTimeout(calc,400);
});
</script></body></html>
