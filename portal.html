<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do cliente | Milani Soluções Digitais</title><link rel="icon" href="/logo-milani.png"><style>:root{font-family:system-ui,Arial;color:#edf5ff;background:#07152d}*{box-sizing:border-box}body{margin:0}main{max-width:860px;margin:5vh auto;padding:22px}.box{background:#102543;border:1px solid #345579;border-radius:20px;padding:28px;margin:18px 0}h1{font-size:clamp(28px,5vw,42px)}p{color:#bed1e7;line-height:1.6}label{display:block;margin:15px 0 7px}input,textarea{display:block;width:100%;padding:13px;border:1px solid #567092;background:#091b33;border-radius:10px;color:#fff}button,.btn{display:inline-block;background:#247bff;border:0;border-radius:10px;padding:13px 19px;color:#fff;font-weight:700;cursor:pointer;margin:12px 7px 0 0}button.secondary{background:#294564}a{color:#8cd5ff}.hidden{display:none}.msg{min-height:28px;color:#8fe6c4}.card{padding:14px;border:1px solid #385676;border-radius:12px;margin:10px 0}small{color:#b6c9e1}</style></head><body><main><a href="/">← Voltar ao site</a><h1>Área do cliente</h1><p>Cadastre-se, acesse sua conta e acompanhe suas solicitações. Os pagamentos online ainda não estão disponíveis.</p><div class="box" id="auth"><h2>Entrar ou criar conta</h2><form id="authForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><label for="password">Senha (mínimo 8 caracteres)</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><button type="submit">Entrar</button><button class="secondary" id="register" type="button">Criar conta</button></form><p><small>Ao criar sua conta, pode ser necessário confirmar o e-mail antes de entrar.</small></p></div><div id="dashboard" class="hidden"><div class="box"><h2>Meu painel</h2><p id="who"></p><button id="logout" class="secondary">Sair</button></div><div class="box"><h2>Minha empresa</h2><form id="companyForm"><label for="companyName">Nome da empresa</label><input id="companyName" maxlength="120" minlength="2" required><button>Adicionar empresa</button></form><div id="companies"></div></div><div class="box"><h2>Nova solicitação</h2><form id="requestForm"><label for="subject">Assunto</label><input id="subject" minlength="3" maxlength="160" required><label for="details">Descrição</label><textarea id="details" rows="4" maxlength="3000"></textarea><button>Enviar solicitação</button></form><div id="requests"></div></div></div><p id="message" class="msg" role="status" aria-live="polite"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.8';
const supabase=createClient('https://lydznydmkcwqtxukktyy.supabase.co','sb_publishable_jJ98f2Xpok2CrjJ4KfRFmA_ahQaWfAv');
const el=id=>document.getElementById(id), msg=t=>{el('message').textContent=t||''};
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null;
async function refresh(){const {data:{user:u},error}=await supabase.auth.getUser();user=error?null:u;el('auth').classList.toggle('hidden',!!user);el('dashboard').classList.toggle('hidden',!user);if(!user)return;el('who').textContent=user.email;await loadData()}
async function loadData(){const [a,b]=await Promise.all([supabase.from('client_companies').select('id,name,created_at').order('created_at',{ascending:false}),supabase.from('client_requests').select('id,subject,status,created_at').order('created_at',{ascending:false})]);if(a.error||b.error){msg('Não foi possível carregar os dados: '+(a.error?.message||b.error?.message));return}el('companies').innerHTML=a.data.length?a.data.map(x=>'<div class="card">'+escape(x.name)+'</div>').join(''):'<p>Nenhuma empresa cadastrada.</p>';el('requests').innerHTML=b.data.length?b.data.map(x=>'<div class="card"><strong>'+escape(x.subject)+'</strong> — '+escape(x.status)+'</div>').join(''):'<p>Nenhuma solicitação registrada.</p>'}
el('authForm').addEventListener('submit',async e=>{e.preventDefault();msg('Entrando...');const {error}=await supabase.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});msg(error?error.message:'Login realizado.');if(!error)await refresh()});
el('register').addEventListener('click',async()=>{if(!el('authForm').reportValidity())return;msg('Criando conta...');const {data,error}=await supabase.auth.signUp({email:el('email').value.trim(),password:el('password').value,options:{emailRedirectTo:location.origin+'/portal.html'}});msg(error?error.message:data.session?'Conta criada!':'Cadastro recebido. Confira seu e-mail para confirmar a conta.');if(data.session)await refresh()});
el('logout').onclick=async()=>{await supabase.auth.signOut();msg('Sessão encerrada.');await refresh()};
el('companyForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const {error}=await supabase.from('client_companies').insert({owner_id:user.id,name:el('companyName').value.trim()});msg(error?error.message:'Empresa cadastrada.');if(!error){e.target.reset();await loadData()}};
el('requestForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const {error}=await supabase.from('client_requests').insert({owner_id:user.id,subject:el('subject').value.trim(),details:el('details').value.trim()});msg(error?error.message:'Solicitação registrada.');if(!error){e.target.reset();await loadData()}};
supabase.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();
</script></body></html>
